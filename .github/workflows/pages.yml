name: Tracking website
on:
  push:
    branches: [main]
    paths: ['driver-site/dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check driver-site/dist/app.mjs && node --check driver-site/dist/portal.mjs && node tests/driver-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: driver-site/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
